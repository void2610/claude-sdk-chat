<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDK Chat</title>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f3; --panel: #ffffff; --fg: #1f1e1c; --muted: #85827b; --line: #e4e1da;
    --accent: #c96442; --accent-fg: #fff; --user: #ece9e1; --code: #f1efe9;
    --ok: #3f8f5a; --err: #c2453d; --run: #c9932f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918; --panel: #232220; --fg: #e9e6df; --muted: #8e8a82; --line: #34322e;
      --accent: #d97757; --user: #2d2b28; --code: #2a2825;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 15px/1.7 -apple-system, "Hiragino Sans", sans-serif; }
  button, select, input, textarea { font: inherit; color: inherit; }

  /* 上部のバー */
  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 700; margin-right: 8px; white-space: nowrap; }
  .pill { appearance: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 28px 4px 12px; font-size: 13px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  #cwd { max-width: 360px; min-width: 0; }
  .spacer { flex: 1; }
  #tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
  .tab { display: flex; align-items: center; gap: 6px; max-width: 220px; padding: 4px 6px 4px 10px; border: 1px solid transparent; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab:hover { background: var(--bg); }
  .tab.active { background: var(--bg); border-color: var(--line); color: var(--fg); }
  .tab.unread .tlabel { color: var(--fg); font-weight: 700; }
  .tlabel { overflow: hidden; text-overflow: ellipsis; }
  .tstate { flex: none; font-size: 11px; color: var(--run); }
  .tstate.busy { width: 8px; height: 8px; border-radius: 50%; background: var(--run); animation: pulse 1s infinite alternate; }
  .tclose { flex: none; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; border-radius: 4px; line-height: 1; visibility: hidden; }
  .tab:hover .tclose, .tab.active .tclose { visibility: visible; }
  .tclose:hover { color: var(--fg); background: var(--line); }
  .cost { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #openSettings { font-size: 16px; line-height: 1; padding: 4px 8px; }
  .icon-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .icon-btn:hover, .pill:hover { border-color: var(--muted); }
  .warn { color: var(--err); }
  .bg { color: var(--run); }
  .task-stop { margin-left: auto; flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-size: 12px; padding: 0 8px; cursor: pointer; }
  .task-stop:hover { border-color: var(--err); color: var(--err); }

  /* 会話 */
  main { flex: 1; overflow-y: auto; }
  .log { max-width: 820px; margin: 0 auto; padding: 24px 16px 8px; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h2 { color: var(--fg); font-size: 22px; margin: 0 0 8px; }
  .user.long { max-height: 15em; overflow: hidden; cursor: pointer; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .user { margin: 20px 0 12px auto; width: fit-content; max-width: 85%; background: var(--user); border-radius: 14px; padding: 8px 14px; white-space: pre-wrap; word-break: break-word; }
  .md { word-break: break-word; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol { margin: 0 0 10px; }
  .md code { font: 13px ui-monospace, Menlo, monospace; background: var(--code); border-radius: 4px; padding: 1px 5px; }
  .md pre { background: var(--code); border-radius: 8px; padding: 12px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: 0 0 10px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 10px; }
  .md a { color: var(--accent); }
  .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }

  /* ツール */
  details.tool { margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; }
  details.tool summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 6px 10px; }
  details.tool summary::-webkit-details-marker { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); flex: none; animation: pulse 1s infinite alternate; }
  .tool.ok .dot { background: var(--ok); animation: none; } .tool.err .dot { background: var(--err); animation: none; }
  @keyframes pulse { to { opacity: .3; } }
  .tname { font-weight: 600; flex: none; }
  .tsum { font-family: ui-monospace, Menlo, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); max-height: 320px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .tool.err pre.out { color: var(--err); }
  .meta { font-size: 12px; color: var(--muted); margin: 6px 0 16px; font-variant-numeric: tabular-nums; }
  .error { color: var(--err); font-size: 13px; margin: 8px 0; }
  .thinking { color: var(--muted); font-size: 13px; margin: 8px 0; }
  .thinking::after { content: "…"; animation: pulse .8s infinite alternate; }

  /* 入力 */
  footer { padding: 8px 16px 16px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px; }
  .composer:focus-within { border-color: var(--muted); }
  textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; max-height: 40vh; padding: 6px 0; }
  #send { flex: none; width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); cursor: pointer; font-size: 16px; }
  #send:disabled { opacity: .4; cursor: default; }
  #send.stop { background: var(--fg); color: var(--bg); }
  .status { max-width: 820px; margin: 6px auto 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .status .pill { field-sizing: content; border-color: transparent; background-color: transparent; color: var(--muted); padding: 2px 24px 2px 8px; }
  .status .pill:hover { border-color: var(--line); color: var(--fg); }
  .hint { max-width: 820px; margin: 2px auto 0; font-size: 12px; color: var(--muted); text-align: right; }

  /* 設定 */
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--fg); padding: 20px; width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog h3 { margin: 0 0 12px; }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  dialog input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; }
  .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .primary { border: 0; border-radius: 8px; padding: 6px 14px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }

  dialog.wide { width: min(640px, calc(100vw - 32px)); }
  .hbar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .hbar input[type=search] { flex: 1; width: auto; }
  .check { display: flex; gap: 4px; align-items: center; white-space: nowrap; font-size: 13px; color: var(--muted); margin: 0; }
  .check input { width: auto; }
  #historyList { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .session { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .session:hover { background: var(--bg); border-color: var(--line); }
  .stitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .smeta { font-size: 12px; color: var(--muted); }

  @media (max-width: 640px) { #cwd { max-width: 100%; } .hint { display: none; } }
</style>
</head>
<body>
<header>
  <span class="brand">SDK Chat</span>
  <nav id="tabs"></nav>
  <button class="icon-btn" id="reset" type="button" title="新しいタブ (Alt+T)">＋</button>
  <span class="spacer"></span>
  <button class="icon-btn" id="openHistory" type="button" title="過去の会話を再開">履歴</button>
  <button class="icon-btn" id="openSettings" type="button" title="設定">⚙</button>
</header>

<main id="scroller"></main>

<footer>
  <form class="composer" id="form">
    <textarea id="prompt" rows="1" placeholder="メッセージを入力"></textarea>
    <button id="send" title="送信">↑</button>
  </form>
  <div class="status">
    <select id="cwd" class="pill" title="作業ディレクトリ"></select>
    <select id="model" class="pill" title="モデル"></select>
    <select id="effort" class="pill" title="エフォート"></select>
    <span class="cost bg" id="bgTasks" hidden></span>
    <span class="spacer"></span>
    <span class="cost" id="total" title="この会話の合計">$0.0000</span>
  </div>
  <div class="hint">Enter で送信 · Shift+Enter で改行 · ↑↓ で過去のプロンプト · Esc で停止</div>
</footer>

<dialog id="history" class="wide">
  <h3>過去の会話</h3>
  <div class="hbar">
    <input id="historySearch" type="search" placeholder="題名やフォルダで絞り込み">
    <label class="check"><input id="historyHere" type="checkbox"> このフォルダのみ</label>
  </div>
  <div id="historyList"></div>
  <form method="dialog" class="row"><button class="icon-btn">閉じる</button></form>
</dialog>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3>設定</h3>
    <label for="key">API キー (<span id="keyState"></span>)</label>
    <input id="key" type="password" placeholder="sk-ant-api03-…" autocomplete="off">
    <div class="row">
      <button class="icon-btn" value="cancel" formnovalidate>閉じる</button>
      <button class="primary" id="saveKey" value="save">保存</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch {} return v; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const md = (text) => DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
const shortPath = (p) => p.replace(/^\/Users\/[^/]+/, "~");
const k = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : n);
const PICK = "__pick__";
const TASK_LABEL = { local_bash: "シェル", monitor: "Monitor", local_agent: "エージェント", remote_agent: "リモートエージェント", workflow: "ワークフロー" };

let hasKey = false;
const post = async (url, body) => {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `${res.status}`);
  return res.json();
};
// 失敗を握りつぶして「読み込み中」のまま止まらないよう、HTTP の失敗も例外にする
const getJson = async (url) => {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`.trim());
  return res.json();
};

/* タブ: 1 タブ = 1 会話。裏のタブの会話もサーバー側で動き続ける */
const tabs = [];
let cur = null;
const scroller = $("scroller");
scroller.addEventListener("scroll", () => { if (cur) cur.stick = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80; });
const follow = (tab) => { if (tab === cur && tab.stick) scroller.scrollTop = scroller.scrollHeight; };
const append = (tab, node) => { tab.logEl.append(node); follow(tab); return node; };

const makeTab = () => {
  const tab = {
    id: crypto.randomUUID(), logEl: el("div", "log"), conv: null, events: null, renderer: null, busy: false,
    sessionId: null, total: 0, title: null, bg: [], unread: false, stick: true, scrollTop: 0, draft: "",
    cwd: loadRecent()[0] ?? "", model: store("model") ?? "default", effort: store("effort") ?? "",
  };
  tab.logEl.hidden = true;
  scroller.append(tab.logEl);
  tabs.push(tab);
  showEmpty(tab);
  return tab;
};

const renderTabs = () => {
  $("tabs").replaceChildren(...tabs.map((tab) => {
    const b = el("div", "tab" + (tab === cur ? " active" : "") + (tab.unread ? " unread" : ""));
    b.title = [tab.title, tab.cwd && shortPath(tab.cwd)].filter(Boolean).join("\n");
    const state = el("span", "tstate" + (tab.busy ? " busy" : tab.bg.length ? " bg" : ""));
    state.textContent = tab.busy ? "" : tab.bg.length ? `⧗${tab.bg.length}` : "";
    const close = el("button", "tclose", "×");
    close.type = "button";
    close.title = "タブを閉じる";
    close.onclick = (e) => { e.stopPropagation(); closeTab(tab); };
    b.append(state, el("span", "tlabel", tab.title ?? (tab.cwd ? tab.cwd.split("/").pop() : "新しい会話")), close);
    b.onclick = () => switchTab(tab);
    return b;
  }));
};

const switchTab = (tab) => {
  if (cur) { cur.scrollTop = scroller.scrollTop; cur.draft = ta.value; cur.logEl.hidden = true; }
  cur = tab;
  tab.unread = false;
  tab.logEl.hidden = false;
  scroller.scrollTop = tab.stick ? scroller.scrollHeight : tab.scrollTop;
  ta.value = tab.draft; grow();
  renderDirs(tab.cwd || undefined);
  applyModel();
  renderBackground(tab);
  renderBusy(tab);
  $("total").textContent = "$" + tab.total.toFixed(4);
  renderTabs();
  ta.focus();
};

const newTab = () => switchTab(makeTab());

const closeTab = (tab) => {
  closeConversation(tab);
  tab.logEl.remove();
  const i = tabs.indexOf(tab);
  tabs.splice(i, 1);
  if (!tabs.length) return newTab();
  if (tab === cur) { cur = null; switchTab(tabs[Math.min(i, tabs.length - 1)]); } else renderTabs();
};

const showEmpty = (tab) => {
  const box = el("div", "empty");
  box.append(el("h2", null, "何をしましょうか"));
  box.append(el("div", null, tab.cwd ? shortPath(tab.cwd) : "まず作業ディレクトリを選んでください"));
  if (!hasKey) box.append(el("div", "warn", "API キーが未設定です (⚙ から設定)"));
  tab.logEl.replaceChildren(box);
};

/* 作業ディレクトリ */
const loadRecent = () => { try { return JSON.parse(store("recentDirs") ?? "[]"); } catch { return []; } };
const renderDirs = (selected) => {
  const recent = loadRecent();
  if (selected && !recent.includes(selected)) recent.unshift(selected);
  $("cwd").replaceChildren(
    ...(recent.length ? [] : [Object.assign(new Option("作業ディレクトリ未選択", ""), { disabled: true })]),
    ...recent.map((p) => Object.assign(new Option("📁 " + p.split("/").pop(), p), { title: p })),
    new Option("フォルダを選択…", PICK),
  );
  $("cwd").value = selected ?? "";
  $("cwd").title = selected ?? "作業ディレクトリ";
};
const useDir = (tab, path) => {
  store("recentDirs", JSON.stringify([path, ...loadRecent().filter((p) => p !== path)].slice(0, 10)));
  if (tab.cwd === path) return;
  tab.cwd = path;
  // 会話はフォルダごとに保存されるので、フォルダを変えたら新しい会話にする
  newConversation(tab);
  if (tab === cur) renderDirs(path);
  renderTabs();
};
$("cwd").onchange = async () => {
  const tab = cur;
  if ($("cwd").value !== PICK) return useDir(tab, $("cwd").value);
  const { path } = await (await fetch("/api/pick-dir", { method: "POST" })).json();
  if (path) useDir(tab, path);
  else if (tab === cur) renderDirs(tab.cwd || undefined);
};

/* モデルとエフォート (タブごと。会話の途中でも次の送信から効く) */
let models = [];
const EFFORT_LABEL = { low: "Low", medium: "Medium", high: "High", xhigh: "XHigh", max: "Max" };
const applyModel = () => {
  if (!models.length || !cur) return;
  $("model").value = cur.model;
  if (!$("model").value) $("model").value = cur.model = "default";
  const levels = models.find((m) => m.value === cur.model)?.efforts ?? [];
  $("effort").hidden = !levels.length;
  $("effort").replaceChildren(new Option("エフォート: 既定", ""), ...levels.map((l) => new Option("エフォート: " + EFFORT_LABEL[l], l)));
  if (!levels.includes(cur.effort)) cur.effort = "";
  $("effort").value = cur.effort;
};
fetch("/api/models").then((r) => r.json()).then((list) => {
  models = list;
  $("model").replaceChildren(...list.map((m) => Object.assign(new Option(m.displayName, m.value), { title: m.description })));
  applyModel();
});
$("model").onchange = () => { cur.model = $("model").value; store("model", cur.model); applyModel(); };
$("effort").onchange = () => { cur.effort = $("effort").value; store("effort", cur.effort); };

/* API キー */
const showKey = ({ masked }) => { hasKey = !!masked; $("keyState").textContent = masked ? `保存済み: ${masked}` : "未設定"; $("openSettings").classList.toggle("warn", !masked); };
const refreshEmpty = () => tabs.forEach((t) => { if (!t.sessionId && !t.conv) showEmpty(t); });
fetch("/api/key").then((r) => r.json()).then((key) => { showKey(key); refreshEmpty(); });
$("openSettings").onclick = () => $("settings").showModal();
$("settings").onclose = async () => {
  if ($("settings").returnValue !== "save" || !$("key").value.trim()) return ($("key").value = "");
  const res = await fetch("/api/key", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apiKey: $("key").value }) });
  $("key").value = "";
  showKey(await res.json());
  refreshEmpty();
};

/* ツールの 1 行要約 */
const summarize = (name, input, cwd) => {
  const rel = (p) => (p?.startsWith(cwd + "/") ? p.slice(cwd.length + 1) : shortPath(p ?? ""));
  switch (name) {
    case "Bash": return input.command;
    case "Read": case "Write": case "Edit": case "NotebookEdit": return rel(input.file_path ?? input.notebook_path);
    case "Grep": return `${input.pattern}${input.path ? "  in " + rel(input.path) : ""}`;
    case "Glob": return input.pattern;
    case "WebFetch": return input.url;
    case "WebSearch": return input.query;
    case "Task": case "Agent": return input.description;
    case "TodoWrite": return `${input.todos?.length ?? 0} 件`;
    default: return Object.values(input).find((v) => typeof v === "string") ?? "";
  }
};

// 貼り付けた長文で画面が埋まらないよう、長い発言は畳んでクリックで開く
const addUser = (tab, text) => {
  const node = append(tab, el("div", "user long", text));
  // 裏のタブは描画されず高さが測れないので、表に出たときに測る
  const measure = () => {
    if (node.scrollHeight <= node.clientHeight) return node.classList.remove("long");
    node.title = "クリックで全文を表示";
    node.onclick = () => { node.classList.remove("long"); node.title = ""; node.onclick = null; };
  };
  if (tab === cur) measure(); else tab.pendingMeasure = [...(tab.pendingMeasure ?? []), measure];
};

/* ストリームと履歴の再生で共通の描画 */
const makeRenderer = (tab, live) => {
  const tools = new Map(), tasks = new Map();
  let textNode = null, textBuf = "", pending = false, thinking = null, lastCost = 0;
  const add = (node) => append(tab, node);
  const settle = () => { thinking?.remove(); thinking = null; };
  const renderText = () => { pending = false; if (textNode) { textNode.innerHTML = md(textBuf); follow(tab); } };
  const handle = (ev) => {
    switch (ev.kind) {
      case "session": tab.sessionId = ev.sessionId; break;
      case "busy":
        setBusy(tab, ev.busy);
        if (ev.busy && !thinking) thinking = add(el("div", "thinking", "考えています"));
        if (!ev.busy) settle();
        break;
      case "user": textNode = null; addUser(tab, ev.text); break;
      case "text": settle(); textNode = null; add(el("div", "md")).innerHTML = md(ev.text); break;
      case "text_start": settle(); textBuf = ""; textNode = add(el("div", "md")); break;
      case "text_delta":
        textBuf += ev.text;
        if (!pending) { pending = true; requestAnimationFrame(renderText); }
        break;
      case "tool": {
        settle(); textNode = null;
        const d = el("details", "tool");
        const s = el("summary");
        s.append(el("span", "dot"), el("span", "tname", ev.name), el("span", "tsum", summarize(ev.name, ev.input, tab.cwd)));
        d.append(s, el("pre", "in", JSON.stringify(ev.input, null, 2)));
        tools.set(ev.id, add(d));
        break;
      }
      case "tool_result": {
        const d = tools.get(ev.id);
        if (!d) break;
        d.classList.add(ev.isError ? "err" : "ok");
        d.append(el("pre", "out", ev.text || "(出力なし)"));
        break;
      }
      case "task": {
        textNode = null;
        const d = el("details", "tool task");
        const s = el("summary");
        const stop = el("button", "task-stop", "停止");
        stop.type = "button";
        stop.onclick = (e) => { e.preventDefault(); post("/api/stop-task", { conv: tab.conv, taskId: ev.id }); };
        s.append(el("span", "dot"), el("span", "tname", "⧗ " + (TASK_LABEL[ev.taskType] ?? ev.subagentType ?? ev.taskType ?? "タスク")), el("span", "tsum", ev.description), stop);
        d.append(s, el("pre", "out", "実行中…"));
        tasks.set(ev.id, add(d));
        break;
      }
      case "task_update": {
        const d = tasks.get(ev.id);
        if (!d) break;
        if (ev.description) d.querySelector(".tsum").textContent = ev.description;
        const lines = [ev.summary, ev.lastTool && `直近のツール: ${ev.lastTool}`, ev.usage && `${(ev.usage.duration_ms / 1000).toFixed(0)} 秒 · ツール ${ev.usage.tool_uses} 回 · ${k(ev.usage.total_tokens)} トークン`, ev.error].filter(Boolean);
        if (lines.length) d.querySelector("pre.out").textContent = lines.join("\n");
        if (["completed", "failed", "killed", "stopped"].includes(ev.status)) {
          d.classList.add(ev.status === "completed" ? "ok" : "err");
          d.querySelector(".task-stop")?.remove();
        }
        break;
      }
      case "background": tab.bg = ev.tasks; renderBackground(tab); renderTabs(); break;
      case "error": settle(); add(el("div", "error", ev.text)); break;
      case "result": {
        settle();
        tab.sessionId = ev.sessionId;
        // 開いたままの会話では、費用は会話の始めからの累計で届く
        const cost = Math.max(0, (ev.cost ?? 0) - lastCost);
        lastCost = ev.cost ?? 0;
        tab.total += cost;
        if (tab === cur) $("total").textContent = "$" + tab.total.toFixed(4);
        const parts = [`$${cost.toFixed(4)}`, `${(ev.durationMs / 1000).toFixed(1)} 秒`, `入力 ${k(ev.inputTokens)} / 出力 ${k(ev.outputTokens)} トークン`];
        if (ev.isError) add(el("div", "error", (ev.errors ?? []).join("\n") || "エラーで終了しました"));
        add(el("div", "meta", parts.join(" · ")));
        if (tab !== cur) { tab.unread = true; renderTabs(); }
        break;
      }
      case "closed": finish(); break;
    }
  };
  const finish = () => {
    settle();
    renderText();
    // 結果が届かなかったツールは、中断されたものとして止める
    for (const d of [...tools.values(), ...tasks.values()]) {
      if (!d.classList.contains("ok") && !d.classList.contains("err")) d.classList.add(live ? "err" : "ok");
      d.querySelector(".task-stop")?.remove();
    }
  };
  return { handle, finish };
};

/* 会話 (サーバー側で開いたままの query) */
const renderBackground = (tab) => {
  if (tab !== cur) return;
  $("bgTasks").hidden = !tab.bg.length;
  $("bgTasks").textContent = `⧗ ${tab.bg.length} 件実行中`;
  $("bgTasks").title = tab.bg.map((t) => `${TASK_LABEL[t.type] ?? t.type}: ${t.description}`).join("\n");
};
const renderBusy = (tab) => {
  if (tab !== cur) return;
  $("send").classList.toggle("stop", tab.busy);
  $("send").textContent = tab.busy ? "■" : "↑";
  $("send").title = tab.busy ? "停止" : "送信";
};
const setBusy = (tab, busy) => {
  if (tab.busy === busy) return;
  tab.busy = busy;
  renderBusy(tab);
  renderTabs();
};
const detach = (tab) => {
  tab.events?.close();
  tab.renderer?.finish();
  tab.conv = tab.events = tab.renderer = null;
  tab.bg = [];
  renderBackground(tab);
  setBusy(tab, false);
  renderTabs();
};
const closeConversation = (tab) => {
  if (tab.conv) post("/api/close", { conv: tab.conv }).catch(() => {});
  detach(tab);
};
const newConversation = (tab) => {
  closeConversation(tab);
  tab.sessionId = null; tab.total = 0; tab.title = null;
  if (tab === cur) $("total").textContent = "$0.0000";
  showEmpty(tab);
};
const listen = (tab) => {
  tab.events = new EventSource(`/api/events?conv=${tab.conv}`);
  tab.events.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    tab.renderer?.handle(ev);
    // 会話が閉じたら、次の送信で保存された続きから開き直す
    if (ev.kind === "closed") detach(tab);
  };
};

/* 過去の会話 */
const ago = (t) => {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 60 ? `${m} 分前` : m < 1440 ? `${Math.round(m / 60)} 時間前` : `${Math.round(m / 1440)} 日前`;
};
let sessions = [];
const renderSessions = () => {
  const q = $("historySearch").value.trim().toLowerCase();
  const onlyHere = $("historyHere").checked;
  const list = sessions.filter((s) => (!onlyHere || s.cwd === cur.cwd) && (!q || `${s.title} ${s.cwd}`.toLowerCase().includes(q)));
  $("historyList").replaceChildren(
    ...(list.length ? list.map((s) => {
      const b = el("button", "session");
      b.type = "button";
      b.title = s.cwd ?? "";
      const open = tabs.find((t) => t.sessionId === s.sessionId);
      b.append(el("span", "stitle", (open ? "● " : "") + s.title), el("span", "smeta", [`📁 ${s.cwd?.split("/").pop() ?? "?"}`, ago(s.lastModified), s.gitBranch, open && "タブで開いています"].filter(Boolean).join(" · ")));
      b.onclick = () => { $("history").close(); open ? switchTab(open) : resume(s); };
      return b;
    }) : [el("div", "meta", "該当する会話はありません")]),
  );
};
$("historySearch").oninput = renderSessions;
$("historyHere").onchange = renderSessions;
$("openHistory").onclick = async () => {
  $("historySearch").value = "";
  $("historyList").replaceChildren(el("div", "meta", "読み込み中…"));
  $("history").showModal();
  $("historySearch").focus();
  try {
    sessions = await getJson("/api/sessions");
  } catch (err) {
    return $("historyList").replaceChildren(el("div", "error", `読み込めませんでした: ${err.message}`));
  }
  renderSessions();
};
const resume = async (s) => {
  // 空のタブならそこで、会話中のタブなら新しいタブで開く
  const tab = !cur.sessionId && !cur.conv ? cur : makeTab();
  if (s.cwd) useDir(tab, s.cwd);
  tab.sessionId = s.sessionId;
  tab.title = s.title;
  switchTab(tab);
  tab.logEl.replaceChildren(el("div", "meta", "読み込み中…"));
  let events;
  try {
    events = await getJson(`/api/sessions?dir=${encodeURIComponent(tab.cwd)}&id=${s.sessionId}`);
  } catch (err) {
    tab.sessionId = null;
    return tab.logEl.replaceChildren(el("div", "error", `読み込めませんでした: ${err.message}`));
  }
  tab.logEl.replaceChildren();
  const r = makeRenderer(tab, false);
  events.forEach(r.handle);
  r.finish();
  append(tab, el("div", "meta", "ここから続きを話せます"));
  tab.stick = true; follow(tab); renderTabs(); ta.focus();
};

/* 入力 */
const ta = $("prompt");
const grow = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
ta.addEventListener("input", grow);
// 日本語の変換確定の Enter では送らない
ta.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); $("form").requestSubmit(); }
};

/* 過去のプロンプト (↑↓) */
const loadPrompts = () => { try { return JSON.parse(store("prompts") ?? "[]"); } catch { return []; } };
let promptIndex = -1, draft = "";
const rememberPrompt = (text) => {
  store("prompts", JSON.stringify([text, ...loadPrompts().filter((p) => p !== text)].slice(0, 200)));
  promptIndex = -1;
};
const recallPrompt = (dir) => {
  const prompts = loadPrompts();
  const next = promptIndex + dir;
  if (next < -1 || next >= prompts.length) return false;
  if (promptIndex === -1) draft = ta.value;
  promptIndex = next;
  ta.value = next === -1 ? draft : prompts[next];
  grow();
  const end = dir > 0 ? 0 : ta.value.length;
  ta.setSelectionRange(end, end);
  return true;
};
ta.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229 || e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
  // 複数行の途中ではカーソル移動を優先し、先頭行の ↑ / 最終行の ↓ でだけ履歴をたどる
  const before = ta.value.slice(0, ta.selectionStart), after = ta.value.slice(ta.selectionEnd);
  if (e.key === "ArrowUp" && !before.includes("\n") && recallPrompt(1)) e.preventDefault();
  else if (e.key === "ArrowDown" && !after.includes("\n") && recallPrompt(-1)) e.preventDefault();
});
ta.addEventListener("input", () => { promptIndex = -1; });

const interrupt = (tab) => { if (tab.conv && tab.busy) post("/api/interrupt", { conv: tab.conv }).catch(() => {}); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !document.querySelector("dialog[open]")) interrupt(cur);
  // ブラウザが ⌘T / ⌘W を取るので、タブの操作は Alt で行う
  if (e.altKey && (e.code === "KeyT" || e.code === "KeyN")) { e.preventDefault(); newTab(); }
  if (e.altKey && e.code === "KeyW") { e.preventDefault(); closeTab(cur); }
  if (e.altKey && /^Digit[1-9]$/.test(e.code)) { const t = tabs[Number(e.code.slice(5)) - 1]; if (t) { e.preventDefault(); switchTab(t); } }
});

$("reset").onclick = newTab;
window.addEventListener("beforeunload", () => {
  for (const t of tabs) if (t.conv) navigator.sendBeacon?.("/api/close", new Blob([JSON.stringify({ conv: t.conv })], { type: "application/json" }));
});
// 裏で描いた長文の高さは、タブが表に出てから測る
new MutationObserver(() => { if (cur?.pendingMeasure) { cur.pendingMeasure.forEach((f) => f()); cur.pendingMeasure = null; } }).observe(scroller, { subtree: true, attributes: true, attributeFilter: ["hidden"] });

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const tab = cur;
  if (tab.busy) return interrupt(tab);
  const prompt = ta.value.trim();
  if (!prompt) return;
  if (!tab.cwd) return $("cwd").focus();
  if (!hasKey) return $("settings").showModal();

  if (!tab.sessionId && !tab.conv) tab.logEl.replaceChildren();
  tab.stick = true;
  tab.title ??= prompt.split("\n")[0].slice(0, 40);
  addUser(tab, prompt);
  rememberPrompt(prompt);
  ta.value = ""; tab.draft = ""; grow();
  renderTabs();
  const fresh = !tab.conv;
  if (fresh) { tab.conv = crypto.randomUUID(); tab.renderer = makeRenderer(tab, true); }
  try {
    await post("/api/send", { conv: tab.conv, prompt, cwd: tab.cwd, sessionId: tab.sessionId, model: tab.model, effort: tab.effort });
    if (fresh) listen(tab);
  } catch (err) {
    append(tab, el("div", "error", `送れませんでした: ${err.message}`));
    if (fresh) tab.conv = tab.renderer = null;
  }
};

newTab();
</script>
</body>
</html>

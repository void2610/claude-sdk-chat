<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDK Chat</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #222; --muted: #888; --card: #fff; --line: #ddd; --tool: #f3f0e6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #e6e6e6; --muted: #888; --card: #1f1f1f; --line: #333; --tool: #2a2618; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  header input, header select { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  #cwd { flex: 1; min-width: 240px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 860px; margin: 0 auto 12px; white-space: pre-wrap; word-break: break-word; }
  .user { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .tool { background: var(--tool); border-radius: 6px; padding: 4px 10px; font: 12px ui-monospace, monospace; color: var(--muted); }
  .meta { color: var(--muted); font-size: 12px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: vertical; min-height: 48px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
  button { border: 0; border-radius: 8px; padding: 0 16px; background: #d97757; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <input id="cwd" placeholder="作業ディレクトリ (絶対パス)">
  <select id="mode">
    <option value="acceptEdits">acceptEdits</option>
    <option value="bypassPermissions">bypassPermissions</option>
    <option value="plan">plan</option>
  </select>
  <input id="model" placeholder="model (空なら既定)" size="16">
  <button id="reset" type="button">新しい会話</button>
  <span class="meta" id="total">$0.0000</span>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="prompt" placeholder="⌘+Enter で送信"></textarea>
  <button id="send">送信</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch {} return v; };
$("cwd").value = store("cwd") ?? "";
$("mode").value = store("mode") ?? "acceptEdits";
$("model").value = store("model") ?? "";
let sessionId = null, total = 0;

const add = (cls, text) => {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  $("log").append(el);
  $("log").scrollTop = $("log").scrollHeight;
};

$("reset").onclick = () => { sessionId = null; $("log").innerHTML = ""; };
$("prompt").onkeydown = (e) => { if (e.key === "Enter" && e.metaKey) $("form").requestSubmit(); };

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  ["cwd", "mode", "model"].forEach((k) => store(k, $(k).value));
  add("user", prompt);
  $("prompt").value = "";
  $("send").disabled = true;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, cwd: $("cwd").value, sessionId, model: $("model").value, permissionMode: $("mode").value }),
  });
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    const parts = buf.split("\n\n");
    buf = parts.pop();
    for (const p of parts) {
      const ev = JSON.parse(p.replace(/^data: /, ""));
      if (ev.kind === "session") sessionId = ev.sessionId;
      else if (ev.kind === "text") add("", ev.text);
      else if (ev.kind === "tool") add("tool", `▶ ${ev.name} ${JSON.stringify(ev.input).slice(0, 300)}`);
      else if (ev.kind === "error") add("meta", "エラー: " + ev.text);
      else if (ev.kind === "result") {
        sessionId = ev.sessionId;
        total += ev.cost ?? 0;
        $("total").textContent = "$" + total.toFixed(4);
        add("meta", `このターン $${(ev.cost ?? 0).toFixed(4)}${ev.isError ? " (エラー終了)" : ""}`);
      }
    }
  }
  $("send").disabled = false;
};
</script>
</body>
</html>
